<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>企业官网首页</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* 全局样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* 顶部导航 */
        header {
            background: #ffffff;
            border-bottom: 1px solid #e6e6e6;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav {
            max-width: 1200px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #1f3a8a;
            letter-spacing: 1px;
        }

        .menu a {
            margin-left: 28px;
            font-size: 15px;
            color: #555;
        }

        .menu a:hover {
            color: #1f3a8a;
        }

        /* Banner 区域 */
        .hero {
            background: linear-gradient(120deg, #1f3a8a, #2563eb);
            color: #fff;
            padding: 100px 20px;
            text-align: center;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .hero p {
            font-size: 18px;
            opacity: 0.95;
            max-width: 700px;
            margin: auto;
        }

        .hero button {
            margin-top: 40px;
            padding: 14px 36px;
            font-size: 16px;
            border: none;
            border-radius: 30px;
            background: #ffffff;
            color: #1f3a8a;
            cursor: pointer;
            transition: all 0.3s;
        }

        .hero button:hover {
            background: #e0e7ff;
        }

        /* 内容区 */
        .section {
            max-width: 1200px;
            margin: 80px auto;
            padding: 0 20px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 60px;
        }

        .section-title h2 {
            font-size: 32px;
            margin-bottom: 12px;
        }

        .section-title p {
            color: #666;
            font-size: 16px;
        }

        /* 卡片布局 */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 30px;
        }

        .card {
            background: #ffffff;
            padding: 36px 28px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.06);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 18px 40px rgba(0,0,0,0.12);
        }

        .card h3 {
            margin-bottom: 14px;
            font-size: 20px;
            color: #1f3a8a;
        }

        .card p {
            font-size: 15px;
            color: #555;
        }

        /* 底部 */
        footer {
            background: #111827;
            color: #9ca3af;
            padding: 40px 20px;
            text-align: center;
        }

        footer p {
            font-size: 14px;
        }
